<button id="openBtn">Abrir confirmação</button>
<dialog id="myDialog" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle">Confirmar ação</h2>
    <p>Tem certeza que deseja continuar?</p>
    <form method="dialog">
        <button value="cancelar">Cancelar</button>
        <button value="confirm" autofocus>Confirmar</button>
    </form>
</dialog>
<script>
    const dialog = document.getElementById('myDialog');
    const openBtn = document.getElementById('openBtn');
    openBtn.addEventListener('click', () => dialog.showModal());
    dialog.addEventListener('close', () => {
        console.log('Escolha:', dialog.returnValue);
    });
</script>
